name: csload20261006

x-app-environment: &app-environment
  APP_ENV: development
  AGENT_MODE: mock
  EMBEDDING_MODE: bge
  EMBEDDING_DIMENSIONS: "512"
  RERANKER_ENABLED: "true"
  RERANKER_WARMUP_ON_STARTUP: "true"
  ORDER_BACKEND: postgres
  DATABASE_URL: postgresql+asyncpg://loadtest:loadtest@postgres:5432/loadtest
  REDIS_URL: redis://redis:6379/0
  EVENT_BACKEND: redis
  AGENT_TASK_BACKEND: rabbitmq
  RABBITMQ_URL: amqp://loadtest:loadtest@rabbitmq:5672/
  MINIO_ENABLED: "true"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: loadtest
  MINIO_SECRET_KEY: loadtest123
  MINIO_BUCKET: customer-service-loadtest
  AUTO_CREATE_SCHEMA: "false"
  EVIDENCE_ANALYSIS_ENABLED: "false"
  HF_HOME: /root/.cache/huggingface

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: loadtest
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d loadtest"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: loadtest
      RABBITMQ_DEFAULT_PASS: loadtest
    ports: ["127.0.0.1:25673:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: loadtest
      MINIO_ROOT_PASSWORD: loadtest123
      MINIO_DEFAULT_BUCKETS: customer-service-loadtest
    volumes: ["minio_data:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: customerserviceproject-backend:latest
    environment: *app-environment
    command: >-
      sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --no-access-log --no-proxy-headers"
    ports: ["127.0.0.1:18000:8000"]
    volumes: ["huggingface_cache:/root/.cache/huggingface"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  outbox-relay:
    image: customerserviceproject-outbox-relay:latest
    environment: *app-environment
    command: ["python", "-m", "backend.app.workers.outbox_relay"]
    depends_on:
      backend: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  agent-worker:
    image: customerserviceproject-agent-worker:latest
    environment: *app-environment
    command: ["python", "-m", "backend.app.workers.agent_reply"]
    volumes: ["huggingface_cache:/root/.cache/huggingface"]
    depends_on:
      backend: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  after-sales-worker:
    image: customerserviceproject-after-sales-worker:latest
    environment: *app-environment
    command: ["python", "-m", "backend.app.workers.after_sales"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  huggingface_cache:
    external: true
    name: customerserviceproject_huggingface_cache
