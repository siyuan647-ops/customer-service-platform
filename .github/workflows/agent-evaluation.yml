name: Agent evaluation

on:
  pull_request:
    paths:
      - "backend/app/agents/**"
      - "backend/app/evaluation/**"
      - "backend/app/orchestration/**"
      - "backend/app/services/after_sales_rules.py"
      - "knowledge_docs/**"
      - "evals/**"
      - "tests/test_evaluation_harness.py"
      - "pyproject.toml"
      - ".github/workflows/agent-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/agents/**"
      - "backend/app/evaluation/**"
      - "backend/app/orchestration/**"
      - "backend/app/services/after_sales_rules.py"
      - "knowledge_docs/**"
      - "evals/**"
      - "tests/test_evaluation_harness.py"
      - "pyproject.toml"
      - ".github/workflows/agent-evaluation.yml"
  workflow_dispatch:

jobs:
  mock-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mock-evaluation dependencies
        run: |
          python -m pip install --no-deps -e .
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              project = tomllib.load(pyproject_file)["project"]
          dependencies = [
              dependency
              for dependency in project["dependencies"]
              if not dependency.startswith("sentence-transformers")
          ]
          dependencies.extend(project["optional-dependencies"]["dev"])
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY
      - run: python -m pytest tests/test_evaluation_harness.py
      - run: python -m backend.app.evaluation --mode mock
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report
          path: artifacts/evaluation/
          if-no-files-found: warn
